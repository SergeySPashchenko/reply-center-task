services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    volumes:
      - .:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: reply_center
      DB_USERNAME: app
      DB_PASSWORD: secret
    command: tail -f /dev/null

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: reply_center
      POSTGRES_USER: app
      POSTGRES_PASSWORD: secret
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d reply_center"]
      interval: 3s
      timeout: 3s
      retries: 20
